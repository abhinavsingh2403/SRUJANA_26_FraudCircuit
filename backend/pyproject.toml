[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard-backend"
version = "0.4.0"
description = "Explainable, case-based transaction-risk triage prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["traceguard*"]


[tool.setuptools.package-data]
traceguard = ["static/*.html", "static/*.css", "static/*.js"]
